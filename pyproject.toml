[project]
name = "insight-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "httpx>=0.27.0",
  "trafilatura>=1.12.0",
  "beautifulsoup4>=4.12.0",
  "python-dotenv>=1.0.0",
  "tenacity>=8.5.0",
  "openai>=1.40.0",
  "duckduckgo_search>=6.2.0",
  "pymysql>=1.1.0",
  "streamlit>=1.37.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "types-beautifulsoup4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = [
  "data*",
  "logs*",
  "frontend*",
  "run_logs*",
  "scripts*",
  "tests*",
  "docs*",
  "examples*",
]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
strict = false

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
